name: CloudForge CI/CD Pipeline

# Trigger the workflow on push or pull request events to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  # github.repository returns 'owner/repo'
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------
  # Job 1: Test and SAST Security Scan
  # ---------------------------------------------
  test-and-scan:
    name: Test and Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: 'pip' # Automatically caches dependencies for faster runs
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install testing and linting tools
          pip install flake8 pytest bandit
          # Install application requirements
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          
      - name: Lint codebase
        run: |
          # Stop the build if there are critical Python syntax errors
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          
      - name: Static Application Security Testing (Bandit)
        run: |
          # Scan for known security vulnerabilities in Python code (SAST)
          # -ll filters for medium/high severity, -ii filters for medium/high confidence
          bandit -r backend -ll -ii || echo "Bandit warnings detected."
          
      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Unit Tests
        run: |
          # Execute test suite
          PYTHONPATH=backend pytest backend/tests/

  # ---------------------------------------------
  # Job 2: Build, Container Security Scan, & Push
  # ---------------------------------------------
  build-and-push:
    name: Build, Scan, and Push Docker Image
    runs-on: ubuntu-latest
    needs: test-and-scan
    # Only run container build/push on direct pushes or merges to main, not on open PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    # Required permissions to push to GitHub Container Registry (GHCR)
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        
      - name: Log in to the Container registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@8e539ec88fb8fa34c264a274df269d25514f7626
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          
      - name: Build Docker image locally (for scanning)
        uses: docker/build-push-action@4a13e500e55bc31b36bb1bbce6f18ed4c770d10b
        with:
          context: ./backend
          load: true # Keeps the image local instead of pushing
          tags: cloudforge-backend:local
          
      - name: Run Trivy vulnerability scanner on Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cloudforge-backend:local'
          format: 'table'
          exit-code: '1' # Fails the pipeline if vulnerabilities are found
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          
      - name: Push Docker image
        uses: docker/build-push-action@4a13e500e55bc31b36bb1bbce6f18ed4c770d10b
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ---------------------------------------------
  # Job 3: Continuous Deployment (Placeholder)
  # ---------------------------------------------
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Deployment Instructions Placeholder
        run: |
          echo "🚀 Pipeline is ready for deployment!"
          echo "Target Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:main"
          echo "TODO: Insert deployment commands here."
          echo "Examples: "
          echo "  - aws ecs update-service --cluster cloudforge --service backend"
          echo "  - terraform apply -auto-approve"
          echo "  - kubectl set image deployment/cloudforge-backend backend=..."
